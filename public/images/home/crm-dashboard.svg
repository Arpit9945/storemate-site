    <path d="M232 400 C 262 392, 282 360, 301 362 S 345 384, 370 372 S 415 318, 440 322 S 485 352, 509 340 S 552 290, 578 296 S 626 270, 648 276 L648 424 L232 424 Z" fill="url(#area)"/>
