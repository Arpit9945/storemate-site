    <clipPath id="rateCard"><rect x="16" y="470" width="158" height="128" rx="14"/></clipPath>
    <rect x="16" y="470" width="158" height="128" rx="14" fill="#1E1420"/>
    <g clip-path="url(#rateCard)">
