<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Kumbh Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Storemate CRM dashboard preview</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E93558"/>
      <stop offset="1" stop-color="#7026ED"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E93558" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E93558" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E93558"/>
      <stop offset="1" stop-color="#7026ED"/>
    </linearGradient>
    <clipPath id="frame"><rect width="960" height="620" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="620" fill="#FFFFFF"/>

    <!-- browser bar -->
    <rect width="960" height="44" fill="#FAF5F4"/>
    <line x1="0" y1="44" x2="960" y2="44" stroke="#ECDFE3"/>
    <circle cx="24" cy="22" r="5.5" fill="#F26B6B"/>
    <circle cx="42" cy="22" r="5.5" fill="#F5BE4F"/>
    <circle cx="60" cy="22" r="5.5" fill="#4CC37A"/>
    <rect x="350" y="11" width="260" height="22" rx="11" fill="#FFFFFF" stroke="#ECDFE3"/>
    <path d="M368 20.5v-2a3 3 0 0 1 6 0v2" fill="none" stroke="#8A7A82" stroke-width="1.3"/>
    <rect x="366.5" y="20" width="9" height="7" rx="1.5" fill="#8A7A82"/>
    <text x="384" y="26.5" font-size="11.5" fill="#4A3B44">app.storematehq.com/dashboard</text>

    <!-- sidebar -->
    <rect x="0" y="44" width="190" height="576" fill="#FFFDFC"/>
    <line x1="190" y1="44" x2="190" y2="620" stroke="#ECDFE3"/>
    <rect x="22" y="66" width="28" height="28" rx="8" fill="url(#brand)"/>
    <path d="M36 72l2.2 5.6 5.8 2.4-5.8 2.4L36 88l-2.2-5.6-5.8-2.4 5.8-2.4z" fill="#fff"/>
    <text x="60" y="86" font-size="15.5" font-weight="800" fill="#1E1420">Storemate</text>

    <g font-size="13" fill="#4A3B44">
      <rect x="14" y="116" width="162" height="34" rx="10" fill="#FDEEF2"/>
      <rect x="28" y="126" width="14" height="14" rx="4" fill="#E93558"/>
      <text x="52" y="137.5" fill="#E93558" font-weight="700">Dashboard</text>

      <rect x="28" y="168" width="14" height="14" rx="4" fill="none" stroke="#8A7A82" stroke-width="1.6"/>
      <text x="52" y="179.5">Inventory</text>
      <circle cx="35" cy="217" r="7" fill="none" stroke="#8A7A82" stroke-width="1.6"/>
      <text x="52" y="221.5">Customers</text>
      <rect x="28" y="252" width="14" height="14" rx="2" fill="none" stroke="#8A7A82" stroke-width="1.6"/>
      <text x="52" y="263.5">Orders &amp; repairs</text>
      <rect x="29" y="294" width="12" height="15" rx="2" fill="none" stroke="#8A7A82" stroke-width="1.6"/>
      <text x="52" y="305.5">GST billing</text>
      <path d="M28 349h14M31 343v6M39 343v6M28 343l7-5 7 5" fill="none" stroke="#8A7A82" stroke-width="1.6" stroke-linejoin="round"/>
