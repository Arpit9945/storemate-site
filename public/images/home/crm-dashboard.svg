    <text x="128" y="530" font-size="12" fill="#FFFFFF" fill-opacity="0.6">/g</text>
    <rect x="30" y="546" width="78" height="22" rx="11" fill="#34D399" fill-opacity="0.18"/>
    <text x="40" y="561" font-size="11.5" font-weight="700" fill="#34D399">▲ 0.8% today</text>
    <text x="30" y="586" font-size="10.5" fill="#FFFFFF" fill-opacity="0.5">24K ₹7,355 · 18K ₹5,516</text>

