    <rect x="530" y="258" width="96" height="26" rx="8" fill="#1E1420"/>
    <text x="578" y="275" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">₹3,12,400</text>
    <g font-size="11" fill="#8A7A82" text-anchor="middle">
      <text x="232" y="442">Mon</text><text x="301" y="442">Tue</text><text x="370" y="442">Wed</text>
      <text x="440" y="442">Thu</text><text x="509" y="442">Fri</text><text x="578" y="442">Sat</text><text x="645" y="442">Sun</text>
    </g>

