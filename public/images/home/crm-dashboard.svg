    <circle cx="694" cy="83" r="5.5" fill="none" stroke="#4A3B44" stroke-width="1.5"/>
    <path d="M698 87l3.5 3.5" stroke="#4A3B44" stroke-width="1.5" stroke-linecap="round"/>
    <text x="708" y="87.5" font-size="12" fill="#8A7A82">Search…</text>
    <rect x="808" y="66" width="132" height="34" rx="17" fill="url(#brand)"/>
    <text x="874" y="87.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ New bill</text>

