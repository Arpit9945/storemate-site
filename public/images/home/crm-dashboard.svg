    <text x="698" y="250" font-size="14" font-weight="700" fill="#1E1420">Stock by purity</text>
    <g transform="translate(762 340) rotate(-90)">
      <circle r="46" fill="none" stroke="#F3EBFD" stroke-width="16"/>
      <circle r="46" fill="none" stroke="#E93558" stroke-width="16" stroke-dasharray="167.6 289" />
      <circle r="46" fill="none" stroke="#7026ED" stroke-width="16" stroke-dasharray="78 289" stroke-dashoffset="-170.5"/>
      <circle r="46" fill="none" stroke="#F5A35C" stroke-width="16" stroke-dasharray="37 289" stroke-dashoffset="-251.5"/>
    </g>
    <text x="762" y="338" font-size="17" font-weight="800" fill="#1E1420" text-anchor="middle">12.8</text>
    <text x="762" y="354" font-size="10.5" fill="#8A7A82" text-anchor="middle">kg total</text>
    <g font-size="12" fill="#4A3B44">
      <rect x="836" y="300" width="10" height="10" rx="3" fill="#E93558"/><text x="852" y="309.5">22K</text><text x="922" y="309.5" text-anchor="end" font-weight="700" fill="#1E1420">58%</text>
      <rect x="836" y="330" width="10" height="10" rx="3" fill="#7026ED"/><text x="852" y="339.5">18K</text><text x="922" y="339.5" text-anchor="end" font-weight="700" fill="#1E1420">27%</text>
      <rect x="836" y="360" width="10" height="10" rx="3" fill="#F5A35C"/><text x="852" y="369.5">24K</text><text x="922" y="369.5" text-anchor="end" font-weight="700" fill="#1E1420">15%</text>
    </g>
    <rect x="698" y="408" width="224" height="30" rx="10" fill="#FAF5F4"/>
    <text x="710" y="427.5" font-size="11.5" fill="#4A3B44">Silver stock</text>
    <text x="910" y="427.5" font-size="11.5" font-weight="700" fill="#1E1420" text-anchor="end">8.42 kg</text>

    <!-- recent bills -->
    <rect x="214" y="468" width="726" height="140" rx="14" fill="#FFFFFF" stroke="#ECDFE3"/>
    <text x="232" y="494" font-size="14" font-weight="700" fill="#1E1420">Recent bills</text>
    <text x="922" y="494" font-size="12" font-weight="700" fill="#E93558" text-anchor="end">View all →</text>
    <g font-size="10.5" fill="#8A7A82" font-weight="700" letter-spacing="0.6">
      <text x="232" y="518">ITEM</text><text x="480" y="518">PURITY</text><text x="570" y="518">NET WT.</text><text x="680" y="518">AMOUNT</text><text x="830" y="518">STATUS</text>
    </g>
    <line x1="232" y1="526" x2="922" y2="526" stroke="#ECDFE3"/>
    <g font-size="12.5" fill="#1E1420">
      <rect x="232" y="534" width="22" height="22" rx="7" fill="#FDEEF2"/>
      <text x="264" y="549.5" font-weight="600">Bridal necklace set</text>
      <text x="480" y="549.5" fill="#4A3B44">22K</text><text x="570" y="549.5" fill="#4A3B44">48.250 g</text>
      <text x="680" y="549.5" font-weight="700">₹3,42,800</text>
      <rect x="830" y="536" width="50" height="20" rx="10" fill="#1A9E5C" fill-opacity="0.12"/>
      <text x="855" y="550" font-size="11" font-weight="700" fill="#1A9E5C" text-anchor="middle">Paid</text>

      <rect x="232" y="566" width="22" height="22" rx="7" fill="#F3EBFD"/>
      <text x="264" y="581.5" font-weight="600">Diamond solitaire ring</text>
      <text x="480" y="581.5" fill="#4A3B44">18K</text><text x="570" y="581.5" fill="#4A3B44">6.120 g</text>
      <text x="680" y="581.5" font-weight="700">₹68,400</text>
      <rect x="830" y="568" width="64" height="20" rx="10" fill="#F5A35C" fill-opacity="0.16"/>
      <text x="862" y="582" font-size="11" font-weight="700" fill="#C46A1C" text-anchor="middle">Pending</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="959" height="619" rx="17.5" fill="none" stroke="#ECDFE3"/>
</svg>
