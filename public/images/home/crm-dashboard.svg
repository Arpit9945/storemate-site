      <rect x="399" y="120" width="171" height="88" rx="14" fill="#FFFFFF" stroke="#ECDFE3"/>
      <text x="415" y="146" font-size="11.5" fill="#8A7A82" font-weight="600">Open orders</text>
      <text x="415" y="176" font-size="21" font-weight="800" fill="#1E1420">18</text>
      <text x="415" y="196" font-size="11" font-weight="700" fill="#E93558">4 due this week</text>

      <rect x="584" y="120" width="171" height="88" rx="14" fill="#FFFFFF" stroke="#ECDFE3"/>
      <text x="600" y="146" font-size="11.5" fill="#8A7A82" font-weight="600">Stock (net weight)</text>
      <text x="600" y="176" font-size="21" font-weight="800" fill="#1E1420">12.84 kg</text>
      <text x="600" y="196" font-size="11" font-weight="600" fill="#8A7A82">1,126 pieces</text>

      <rect x="769" y="120" width="171" height="88" rx="14" fill="#FFFFFF" stroke="#ECDFE3"/>
      <text x="785" y="146" font-size="11.5" fill="#8A7A82" font-weight="600">Customers</text>
      <text x="785" y="176" font-size="21" font-weight="800" fill="#1E1420">1,284</text>
